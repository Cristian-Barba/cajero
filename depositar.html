<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Depositos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="depositos.js"></script>
</head>

<body class="bg-dark text-white">
    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <section class="card bg-dark border-secondary shadow-lg p-4" style="width: 100%; max-width: 400px;">
            <div class="card-body text-center">
                <h3 class="card-title fw-bold text-light mb-4">Depositar Efectivo</h3>

                <form>
                    <div class="mb-4 text-start">
                        <label for="montoDeposito" class="form-label text-light">Monto a depositar ($)</label>
                        <input type="number" class="form-control bg-dark text-white border-secondary fs-4"
                            id="montoDeposito" placeholder="0.00" min="1" required>
                    </div>
                    <div class="d-flex flex-column gap-3">
                        <button type="submit" class="btn btn-success w-100 py-2 fs-5" onclick="deposito()">Confirmar
                            Depósito</button>
                        <a href="MenuPrincipal.html" class="btn btn-outline-light w-100 py-2">Cancelar y Volver</a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</body>

</html>
