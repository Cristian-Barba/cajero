<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="Menu.js"></script>
</head>

<body class="bg-dark text-white">

    <!-- Contenedor principal centrado -->
    <div class="d-flex justify-content-center align-items-center min-vh-100">

        <!-- Tarjeta del Menú Principal oscura -->
        <section class="card bg-dark border-secondary shadow-lg p-4" style="width: 100%; max-width: 500px;">
            <div class="card-body">

                <!-- Encabezado con saludo al usuario -->
                <div class="text-center mb-4">
                    <h3 class="card-title fw-bold text-light mb-1">Menú Principal</h3>
                    <p class="text-secondary fs-5 mb-0">Bienvenido, <span id="nombreUsuarioCajero"
                            class="text-white fw-semibold">Usuario</span></p>
                </div>

                <!-- Cuadrícula de opciones del cajero -->
                <div class="row g-3 mb-4 text-center">

                    <!-- Opción 1: Retirar -->
                    <div class="col-6">
                        <button
                            class="btn btn-outline-light w-100 h-100 py-4 d-flex flex-column justify-content-center align-items-center"
                            onclick="reitrar()">
                            <span class="fs-1 mb-2">💵</span>
                            <span class="fw-semibold">Retirar<br>Efectivo</span>
                        </button>
                    </div>

                    <!-- Opción 2: Depositar -->
                    <div class="col-6">
                        <button
                            class="btn btn-outline-light w-100 h-100 py-4 d-flex flex-column justify-content-center align-items-center"
                            onclick="depositar()">
                            <span class="fs-1 mb-2">📥</span>
                            <span class="fw-semibold">Depositar</span>
                        </button>
                    </div>

                    <!-- Opción 3: Consultar Saldo -->
                    <div class="col-6">
                        <button
                            class="btn btn-outline-light w-100 h-100 py-4 d-flex flex-column justify-content-center align-items-center"
                            onclick="consulta()">
                            <span class="fs-1 mb-2">💰</span>
                            <span class="fw-semibold">Consultar<br>Saldo</span>
                        </button>
                    </div>

                    <!-- Opción 4: Transferir o Movimientos -->
                    <div class="col-6">
                        <button
                            class="btn btn-outline-light w-100 h-100 py-4 d-flex flex-column justify-content-center align-items-center"
                            onclick="movimientos()">
                            <span class="fs-1 mb-2">📋</span>
                            <span class="fw-semibold">Ver<br>Movimientos</span>
                        </button>
                    </div>

                </div>

                <!-- Botón para finalizar sesión -->
                <div class="text-center mt-2">
                    <a href="index.html" class="btn btn-danger w-100 py-2 fs-5">Finalizar Sesión</a>
                </div>

            </div>
        </section>

    </div>

</body>

</html>
