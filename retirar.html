<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="retirar.js"></script>
</head>

<body class="bg-dark text-white">
    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <section class="card bg-dark border-secondary shadow-lg p-4" style="width: 100%; max-width: 500px;">
            <div class="card-body text-center">
                <h3 class="card-title fw-bold text-light mb-4">Retirar Efectivo</h3>

                <!-- Opción $100 -->
                <div class="row">
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="montoRapido" id="monto100" value="100"
                            autocomplete="off" onclick="limpiarManual()">
                        <label class="btn btn-outline-light w-100 py-3 fs-5" for="monto100">$100</label>
                    </div>

                    <!-- Opción $200 -->
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="montoRapido" id="monto200" value="200"
                            autocomplete="off" onclick="limpiarManual()">
                        <label class="btn btn-outline-light w-100 py-3 fs-5" for="monto200">$200</label>
                    </div>

                    <!-- Opción $500 -->
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="montoRapido" id="monto500" value="500"
                            autocomplete="off" onclick="limpiarManual()">
                        <label class="btn btn-outline-light w-100 py-3 fs-5" for="monto500">$500</label>
                    </div>

                    <!-- Opción $1000 -->
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="montoRapido" id="monto1000" value="1000"
                            autocomplete="off" onclick="limpiarManual()">
                        <label class="btn btn-outline-light w-100 py-3 fs-5" for="monto1000">$1000</label>
                    </div>
                </div>

                <!-- Otra cantidad -->
                <form class="mb-4 text-start">
                    <label for="montoRetiro" class="form-label text-light text-center w-100">O ingrese otro
                        monto</label>
                    <input type="number" class="form-control bg-dark text-white border-secondary text-center fs-5 mb-3"
                        id="montoRetiro" placeholder="$" min="50" step="50" onfocus="quitarMontoRapido()">
                    <div id="liveAlertPlaceholder"></div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fs-5" onclick="retiro()">Retirar
                        Cantidad</button>
                </form>

                <a href="MenuPrincipal.html" class="btn btn-danger w-100 py-2">Cancelar Transacción</a>
            </div>
        </section>
    </div>
</body>

</html>
