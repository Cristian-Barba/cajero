<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="Login.js"></script>
</head>

<body>
    <!-- Contenedor principal que centra todo en la pantalla -->
    <div class="d-flex justify-content-center align-items-center min-vh-100 bg-light">

        <!-- Tarjeta de registro -->
        <section class="card shadow p-4" style="width: 100%; max-width: 400px;">
            <div class="card-body">

                <h3 class="card-title text-center fw-bold mb-4">Registro de Usuario</h3>

                <form>
                    <!-- Campo: Nombre -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label fw-semibold">Nombre completo</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ej. Juan Pérez" required>
                    </div>

                    <!-- Campo: PIN -->
                    <div class="mb-4">
                        <label for="pin" class="form-label fw-semibold">PIN de seguridad (4 dígitos)</label>
                        <input type="password" class="form-control text-center fs-4 letter-spacing-lg" id="pin"
                            placeholder="****" maxlength="4" required>
                    </div>

                    <!-- Botones del formulario -->
                    <div class="d-flex flex-column gap-2">
                        <div id="liveAlertPlaceholder"></div>
                        <button type="submit" class="btn btn-success w-100 py-2 fs-5" onclick="loguear()">Crear
                            Cuenta</button>
                        <a href="login.html" class="btn btn-secondary w-100 py-2">Volver al
                            Inicio</a>
                    </div>
                </form>

            </div>
        </section>
    </div>
</body>

</html>
