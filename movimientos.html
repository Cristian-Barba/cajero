<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <script src="movimientos.js"></script>
</head>

<body class="bg-dark text-white">
    <div class="d-flex justify-content-center align-items-center min-vh-100 py-4">
        <section class="card bg-dark border-secondary shadow-lg p-4" style="width: 100%; max-width: 500px;">
            <div class="card-body">
                <h3 class="card-title fw-bold text-light text-center mb-4">Últimos Movimientos</h3>

                <!-- Lista de movimientos -->
                <ul class="list-group list-group-flush border-top border-bottom border-secondary mb-4"
                    id="listaMovimientos">
                    <!-- Movimiento 1 -->
                    <li
                        class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center px-0">
                        <div>
                            <span class="d-block fw-semibold">Retiro de Efectivo</span>
                            <small id="retiro" class="text-muted">20 Oct 2026 - 10:30 AM</small>
                        </div>
                        <span id="A" class="text-danger fw-bold">-$500.00</span>
                    </li>
                    <!-- Movimiento 2 -->
                    <li
                        class="list-group-item bg-dark text-white border-secondary d-flex justify-content-between align-items-center px-0">
                        <div>
                            <span class="d-block fw-semibold">Depósito</span>
                            <small id="deposito" class="text-muted">18 Oct 2026 - 04:15 PM</small>
                        </div>
                        <span id="B" class="text-success fw-bold">+$1,500.00</span>
                    </li>
                </ul>

                <a href="MenuPrincipal.html" class="btn btn-outline-light w-100 py-2">Volver al Menú</a>
            </div>
        </section>
    </div>
</body>

</html>
