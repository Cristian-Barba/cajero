    <!DOCTYPE html>
    <html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ingreso - Cajero Automático</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
            crossorigin="anonymous"></script>
        <link rel="stylesheet" href="style.css">
        <script src="Login.js"></script>
    </head>

    <body class="bg-dark text-white">

        <!-- Contenedor centrado -->
        <div class="d-flex justify-content-center align-items-center min-vh-100">

            <!-- Tarjeta de Login oscura -->
            <section class="card bg-dark border-secondary shadow-lg p-4" style="width: 100%; max-width: 400px;">
                <div class="card-body">

                    <h3 class="card-title text-center fw-bold mb-4 text-light">Ingresar</h3>

                    <form>
                        <!-- Campo: Número de Cuenta / Tarjeta -->
                        <div class="mb-3">
                            <label for="loginCuenta" class="form-label text-light">Número de Cuenta</label>
                            <input type="text" class="form-control bg-dark text-white border-secondary" id="loginCuenta"
                                placeholder="16 dígitos" maxlength="16" required>
                        </div>

                        <!-- Campo: PIN -->
                        <div class="mb-4">
                            <label for="loginPin" class="form-label text-light">PIN de seguridad</label>
                            <input type="password"
                                class="form-control bg-dark text-white border-secondary text-center fs-4" id="loginPin"
                                placeholder="****" maxlength="4" required>
                        </div>

                        <!-- Botones -->
                        <div class="d-flex flex-column gap-3">
                            <button type="submit" class="btn btn-primary w-100 py-2 fs-5"
                                onclick="validacion()">Entrar</button>
                            <a href="index.html" class="btn btn-outline-light w-100 py-2">Volver al
                                Inicio</a>
                        </div>
                    </form>

                </div>
            </section>

        </div>

    </body>

    </html>
</body>

</html>
